<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="funnel-title funnel-desc">
  <title id="funnel-title">Runtime and model input reduction in the Azure TypeSpec assessment skill</title>
  <desc id="funnel-desc">Left panel shows runtime dropping from 22m 40s to ~4m (-80%). Right panel shows model input dropping from ~1.6 MB to ~300 KB overall and 3.5 KB on version-transition REST compatibility by deterministically filtering 109 unchanged operations and 237 unchanged REST candidates.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #192740; }
    .panel { fill: #ffffff; stroke: #d4dce8; stroke-width: 1.5; rx: 14; }
    .h { font-size: 17px; font-weight: 700; }
    .sub { font-size: 13px; fill: #56647a; }
    .label { font-size: 13px; font-weight: 600; }
    .val { font-size: 13px; font-weight: 700; }
  </style>
  <rect width="1200" height="320" rx="16" fill="#f5f7fb"/>

  <!-- Left panel: Execution time breakdown -->
  <rect x="24" y="24" width="560" height="272" class="panel"/>
  <text x="48" y="56" class="h">Execution time breakdown: Before vs. After (~80% faster)</text>
  <text x="48" y="78" class="sub">Measured on a large real-world Azure TypeSpec PR assessment</text>

  <!-- Before bar -->
  <text x="48" y="116" class="label">Before optimization (22m 40s total)</text>
  <rect x="48" y="126" width="400" height="32" rx="6" fill="#d9485f"/>
  <rect x="448" y="126" width="82" height="32" rx="6" fill="#f59e0b"/>
  <text x="58" y="147" font-size="12" font-weight="700" fill="#ffffff">18m 51s Coordinator &amp; repeated discovery</text>
  <text x="454" y="147" font-size="11" font-weight="700" fill="#ffffff">3m 48s Agent</text>

  <!-- After bar -->
  <text x="48" y="196" class="label">After optimization (~4m total, 61% fewer AICs)</text>
  <rect x="48" y="206" width="16" height="32" rx="4" fill="#15803d"/>
  <rect x="66" y="206" width="92" height="32" rx="6" fill="#244ca3"/>
  <text x="170" y="227" class="val" fill="#15803d">29.9s Coordinator + ~3.5m focused Agent + Materializer</text>
  <text x="48" y="268" class="sub">Result: 100 → 39 AIC (-61%) · Zero ad-hoc JSON repair scripts · 100% coverage ledger</text>

  <!-- Right panel: Context reduction funnel -->
  <rect x="616" y="24" width="560" height="272" class="panel"/>
  <text x="640" y="56" class="h">Domain-invariant filtering: ~80% smaller model input</text>
  <text x="640" y="78" class="sub">Unchanged carry-over API versions do not require fresh LLM judgment</text>

  <rect x="640" y="102" width="512" height="44" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="656" y="129" class="label" fill="#991b1b">Raw multi-version payload: ~1.6 MB total (~1.6M chars across stages)</text>

  <rect x="680" y="162" width="432" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="696" y="189" class="label" fill="#1e40af">Deterministic filter removes 109 carry-over ops &amp; 237 unchanged REST items</text>

  <rect x="720" y="222" width="352" height="48" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="736" y="245" class="val" fill="#166534">Focused judgment input: ~300 KB total</text>
  <text x="736" y="263" font-size="12" fill="#166534">(REST compatibility stage: 1.6 MB → 3.5 KB)</text>
</svg>