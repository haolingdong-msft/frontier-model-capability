<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="speed-title speed-desc">
<title id="speed-title">LLM smartness versus execution speed, by reasoning effort</title>
<desc id="speed-desc">The horizontal axis is median end-to-end response time in seconds, shown on a logarithmic scale. The vertical axis is Artificial Analysis Intelligence Index v4.3.2. Farther left and higher is better. Only model-effort points with published median end-to-end response time are shown.</desc>
<rect width="1600" height="900" rx="20" fill="#f5f7fb"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192740}</style>
<text x="48" y="58" font-size="40" style="fill:#192740" font-weight="700" text-anchor="start">LLM smartness vs. execution speed</text>
<text x="48" y="93" font-size="21" style="fill:#56647a" font-weight="400" text-anchor="start">Lower response time is faster; reasoning delay is included.</text>
<rect x="48" y="119" width="1504" height="59" rx="10" fill="#e8edf9"/>
<text x="70" y="146" font-size="20" style="fill:#192740" font-weight="600" text-anchor="start">X = median end-to-end response time in seconds (log scale)     Y = capability score     Upper-left is better.</text>
<text x="70" y="167" font-size="15" style="fill:#56647a" font-weight="400" text-anchor="start">This is response-level benchmark speed, not full coding-agent or repository task completion time.</text>
